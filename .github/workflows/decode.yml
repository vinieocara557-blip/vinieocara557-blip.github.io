name: decode-binaries
on:
  push:
    branches: [main]
    paths: ['b64/**', '.github/workflows/decode.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in b64/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "$n"; done
          touch .nojekyll
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "decode binaries" || exit 0
          git push
